apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: usuarioservice-hpa
  namespace: fcg
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: usuarioservice
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60

