apiVersion: apps/v1
kind: Deployment
metadata:
  name: jogoservice
  namespace: fcg

spec:
  replicas: 1

  selector:
    matchLabels:
      app: jogoservice

  template:
    metadata:
      labels:
        app: jogoservice

    spec:
      containers:
        - name: jogoservice
          image: fgc-jogoservice:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 8080

          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: fcg-config
                  key: ASPNETCORE_ENVIRONMENT

            - name: ASPNETCORE_URLS
              valueFrom:
                configMapKeyRef:
                  name: fcg-config
                  key: ASPNETCORE_URLS

            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: fcg-secret
                  key: JOGO_CONNECTION_STRING

            - name: ConfigSecret__Secret
              valueFrom:
                secretKeyRef:
                  name: fcg-secret
                  key: JWT_SECRET

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

---

apiVersion: v1
kind: Service
metadata:
  name: jogoservice
  namespace: fcg

spec:
  selector:
    app: jogoservice

  ports:
    - port: 8080
      targetPort: 8080

  type: ClusterIP