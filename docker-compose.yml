services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${SQL_SA_PASSWORD}"
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - fcg-network
    healthcheck:
      test:
        - CMD-SHELL
        - >
          /opt/mssql-tools18/bin/sqlcmd
          -S localhost -U sa -P "$$MSSQL_SA_PASSWORD"
          -C -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: fcg
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD}"
    ports:
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - fcg-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  usuarioservice:
    build:
      context: .
      dockerfile: FGC/Dockerfile
    image: fcg-usuarioservice:local
    ports:
      - "8081:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      OTEL_SERVICE_NAME: UsuarioService
      OTEL_EXPORTER_OTLP_ENDPOINT: http://fcg-otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=UsuarioServiceDb;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - fcg-network

  jogoservice:
    build:
      context: .
      dockerfile: JogoService/Dockerfile
    image: fcg-jogoservice:local
    ports:
      - "8083:8080"
    environment:
      OTEL_SERVICE_NAME: JogoService
      OTEL_EXPORTER_OTLP_ENDPOINT: http://fcg-otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__User: fcg
      RabbitMQ__Password: "${RABBITMQ_PASSWORD}"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=JogoServiceDb;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;"
    depends_on:
     sqlserver:
      condition: service_healthy
     rabbitmq:
       condition: service_healthy
    networks:
      - fcg-network

  pagamentoservice:
    build:
      context: .
      dockerfile: PagamentoService/Dockerfile
    image: fcg-pagamentoservice:local
    ports:
      - "8084:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=PagamentoServiceDb;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__User: fcg
      RabbitMQ__Password: "${RABBITMQ_PASSWORD}"
      OTEL_SERVICE_NAME: PagamentoService
      OTEL_EXPORTER_OTLP_ENDPOINT: http://fcg-otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - fcg-network

  apigateway:
    build:
      context: .
      dockerfile: ApiGateway/Dockerfile
    image: fcg-apigateway:local
    ports:
      - "8082:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      OTEL_SERVICE_NAME: ApiGateway
      OTEL_EXPORTER_OTLP_ENDPOINT: http://fcg-otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    depends_on:
      - usuarioservice
      - jogoservice
      - pagamentoservice
    networks:
      - fcg-network

volumes:
  sqlserver-data:
    external: true
    name: fcg-sqlserver-data
  rabbitmq-data:

networks:
  fcg-network:
    external: true
    name: fcg-network